<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixFlow IMS — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-sidebar {
            background: linear-gradient(180deg, #00b7a8 0%, #009fbe 100%);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-slide {
            animation: slideIn 0.5s ease forwards;
        }

        .logo-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        button:active::before {
            width: 300px;
            height: 300px;
        }

        .gradient-text {
            background: linear-gradient(135deg, #00b7a8 0%, #009fbe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        input {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #fff !important;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #cbd5e1 !important;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.1) !important;
            border-color: #00b7a8 !important;
            box-shadow: 0 0 20px rgba(0, 183, 168, 0.3) !important;
        }
    </style>
</head>

<body>
    <div class="w-full max-w-xl animate-slide">
        <!-- LOGO SECTION -->
        <div class="text-center mb-12">
            <div class="logo-box inline-block p-4 rounded-3xl mb-6">
                <div class="text-5xl">⚡</div>
            </div>
            <h1 class="text-4xl font-bold gradient-text mb-2">FixFlow IMS</h1>
            <p class="text-white/60 text-lg">Issue Management System</p>
        </div>

        <!-- LOGIN CARD -->
        <div class="glass rounded-3xl p-10 shadow-2xl">
            <h2 class="text-3xl font-bold mb-2">Welcome Back</h2>
            <p class="text-white/60 mb-8">Login to your account</p>

            <form id="loginForm" class="space-y-6">
                <!-- ROLE SELECTION -->
                <div class="flex items-center gap-6 mb-6">
                    <label class="flex items-center gap-2 cursor-pointer text-white/80 hover:text-white">
                        <input type="radio" name="role" value="employee" class="accent-teal-500" checked>
                        <span class="font-semibold">Employee</span>
                    </label>

                    <label class="flex items-center gap-2 cursor-pointer text-white/80 hover:text-white">
                        <input type="radio" name="role" value="technician" class="accent-teal-500">
                        <span class="font-semibold">Technician</span>
                    </label>

                    <label class="flex items-center gap-2 cursor-pointer text-white/80 hover:text-white">
                        <input type="radio" name="role" value="admin" class="accent-teal-500">
                        <span class="font-semibold">Admin</span>
                    </label>
                </div>

                <!-- EMAIL -->
                <div>
                    <label class="block font-semibold mb-2 text-white/90">Email Address</label>
                    <input 
                        id="email"
                        type="email"
                        required
                        placeholder="name@company.com"
                        class="w-full rounded-xl px-4 py-3 text-white/90 transition-all"
                    />
                </div>

                <!-- PASSWORD -->
                <div>
                    <label class="block font-semibold mb-2 text-white/90">Password</label>
                    <input 
                        id="password"
                        type="password"
                        required
                        placeholder="Enter your password"
                        class="w-full rounded-xl px-4 py-3 text-white/90 transition-all"
                    />
                </div>

                <!-- ERROR MESSAGE -->
                <div id="errorMsg" class="hidden bg-red-500/20 border border-red-500/30 rounded-xl p-4 text-red-200 text-sm">
                </div>

                <!-- SUBMIT -->
                <button 
                    type="submit"
                    class="w-full gradient-sidebar text-white py-3 rounded-xl text-lg font-bold hover:shadow-lg hover:shadow-cyan-500/30 transition-all relative overflow-hidden"
                >
                    LOGIN
                </button>

                <p class="text-sm text-white/60 text-center mt-4">
                    Don't have an account? 
                    <a href="signup.html" class="text-cyan-400 font-semibold hover:text-cyan-300">Sign up</a>
                </p>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
